# ボタンの表示（省略時は config.yml の titles.transaction-* を使用）
buttons:
  sell:
    name: '&c&l売却 x%amount%'
    lore:
      - '&7クリックで &f%amount% &7個を売却'
      - '&7受け取り: &a%price%'
  buy:
    name: '&a&l購入 x%amount%'
    lore:
      - '&7クリックで &f%amount% &7個を購入'
      - '&7支払い: &c%price%'
  not-sellable:
    name: '&7売却不可'
    lore:
      - '&8このアイテムは売却できません'
  not-buyable:
    name: '&7購入不可'
    lore:
      - '&8このアイテムは購入できません'
